components:
  schemas:
    Pet:
      type: object
      required: [id, name]
      properties:
        id:
          type: integer
        name:
          type: string
        tag:
          type: string
        status:
          type: string
          enum: [available, sold]
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: integer
        message:
          type: string