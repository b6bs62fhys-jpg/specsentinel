[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "specsentinel"
version = "0.3.0"
description = "Detects when a live API drifts from its OpenAPI spec. Exit code 0 on match, 1 on drift, 2 if the check could not run."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["openapi", "swagger", "api", "api testing", "contract testing", "schema validation", "drift", "ci", "cli", "github actions"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = ["PyYAML>=6"]

[project.urls]
Homepage = "https://github.com/b6bs62fhys-jpg/specsentinel"
Documentation = "https://github.com/b6bs62fhys-jpg/specsentinel#readme"
Source = "https://github.com/b6bs62fhys-jpg/specsentinel"
Issues = "https://github.com/b6bs62fhys-jpg/specsentinel/issues"
Changelog = "https://github.com/b6bs62fhys-jpg/specsentinel/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest>=7", "mypy>=1", "types-PyYAML"]

[project.scripts]
specsentinel = "specsentinel.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.9"
strict = true
files = ["src/specsentinel"]
