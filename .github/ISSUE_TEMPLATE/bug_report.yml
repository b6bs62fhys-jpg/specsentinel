name: Bug report
description: Report a wrong result, a crash or unexpected behaviour.
title: "Bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please remove any real token, password or
        internal URL before you paste output.
  - type: textarea
    id: summary
    attributes:
      label: What happened
      description: A short description of the problem.
    validations:
      required: true
  - type: textarea
    id: spec
    attributes:
      label: Spec excerpt
      description: The part of the OpenAPI document that is involved.
      render: yaml
    validations:
      required: true
  - type: textarea
    id: response
    attributes:
      label: Response excerpt
      description: The response body or headers the API returned.
      render: json
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected
      description: What you expected SpecSentinel to report.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual
      description: What SpecSentinel reported instead, including the command and its output.
      render: shell
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: SpecSentinel version
      description: The output of `specsentinel --version`.
      placeholder: "0.3.0"
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version and OS
      placeholder: "3.12 on Ubuntu 24.04"
    validations:
      required: false
