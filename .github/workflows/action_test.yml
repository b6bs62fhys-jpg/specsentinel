name: Action smoke test

on:
  push:
  pull_request:

jobs:
  action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Start drifting demo API
        run: |
          (python examples/demo_server.py --port 8099 >/dev/null 2>&1 &)
          sleep 2

      - name: Action must fail when the API drifts (exit code 1 passes through)
        id: drift
        continue-on-error: true
        uses: ./
        with:
          spec: examples/petstore.yaml
          url: http://127.0.0.1:8099
          header: "X-SpecSentinel-Test: drift"

      - name: Confirm the drifting run reported drift
        if: always()
        run: |
          test "${{ steps.drift.outcome }}" = "failure"
          echo "Verified: the drifting API failed the step (passthrough of exit code 1)."

      - name: Confirm the summary was written with drift numbers
        if: always()
        run: |
          test "${{ steps.drift.outcome }}" = "failure"
          summary_file="$RUNNER_TEMP/specsentinel-summary.md"
          test -s "$summary_file"
          grep -q "Result: DRIFT (exit code 1)" "$summary_file"
          grep -q "Checked: 4" "$summary_file"
          grep -q "Drift: 2" "$summary_file"
          grep -q "Skipped: 1" "$summary_file"
          grep -qF "MISSING_FIELD" "$summary_file"
          grep -qF -- "\`GET\` \`/pets/{petId}\`" "$summary_file"
          ! grep -q "X-SpecSentinel-Test" "$summary_file"
          echo "Verified: the summary lists result, counts, the first findings and no header values."

      - name: Start conforming demo API
        run: |
          (python examples/demo_server.py --conform --port 8098 >/dev/null 2>&1 &)
          sleep 2

      - name: Action must pass when the API matches (exit code 0)
        id: match
        uses: ./
        with:
          spec: examples/petstore.yaml
          url: http://127.0.0.1:8098

      - name: Confirm the matching run passed
        if: always()
        run: |
          test "${{ steps.match.outcome }}" = "success"
          echo "Verified: the matching API passed the step (exit code 0)."

      - name: Confirm the matching run wrote a clean summary
        if: always()
        run: |
          test "${{ steps.match.outcome }}" = "success"
          summary_file="$RUNNER_TEMP/specsentinel-summary.md"
          grep -q "Result: MATCH (exit code 0)" "$summary_file"
          grep -q "Drift: 0" "$summary_file"
          ! grep -q "X-SpecSentinel-Test" "$summary_file"
          echo "Verified: the matching run summary lists MATCH with zero drift."

      - name: Action must pass with a pinned SpecSentinel version
        id: pinned
        uses: ./
        with:
          spec: examples/petstore.yaml
          url: http://127.0.0.1:8098
          version: "0.1.1"

      - name: Confirm the pinned version was installed
        if: always()
        run: |
          test "${{ steps.pinned.outcome }}" = "success"
          test "$(specsentinel --version)" = "specsentinel 0.1.1"
          echo "Verified: the action installed exactly the pinned version."